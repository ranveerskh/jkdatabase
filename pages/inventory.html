<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <title>Inventory | JK Database</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar"></aside>
      <main class="content">
        <div class="topbar">
          <div>
            <h1>Product Catalog</h1>
            <div class="sub">Products for your sales screen, with vendor and selling prices.</div>
          </div>
          <div class="actions">
            <label class="btn">Import CSV<input id="importProductsPage" type="file" accept=".csv" hidden></label><button class="btn primary" data-click="add">+ Create product</button>
          </div>
        </div>
        <div class="toolbar">
          <input class="search" id="search" placeholder="Search products..." />
          <div class="note" id="count"></div>
        </div>
        <div id="list"></div>
        <dialog id="dlg">
          <form class="modal" id="form">
            <h2 id="modalTitle">Create product</h2>
            <p class="hint">Changes are saved to your business account.</p>
            <input type="hidden" name="id" />
            <div class="formgrid">
              <div class="field">
            <label>SKU (optional)</label><input name="sku" type="text" />
              </div>
              <div class="field"><label>Barcode (optional)</label><input name="barcode" type="text" autocomplete="off" /></div>
              <div class="field"><label>Product photo (optional)</label><input name="imageFile" type="file" accept="image/*" /><small class="hint">A small photo appears on the sale screen.</small><img id="productImagePreview" class="product-image-preview" hidden alt="Product preview" /></div>
              <div class="field">
                <label>Product name</label
                ><input name="name" type="text" />
              </div>
              <div class="field">
                <label>Vendor</label><select name="vendorId" id="productVendor"><option value="">Choose vendor (optional)</option></select>
              </div>
              <div class="field">
                <label>Vendor price / unit cost</label
                ><input name="cost" type="number" step=".01" />
              </div>
              <div class="field">
                <label>Selling price</label
                ><input name="price" type="number" step=".01" />
              </div>
            </div>
            <div class="footer">
              <button type="button" class="btn" data-click="close">
                Cancel</button
              ><button class="btn primary">Save Product</button>
            </div>
          </form>
        </dialog>
      <dialog id="adjustDlg"><form id="adjustForm" class="modal"><h2>Stock Adjustment</h2><p class="hint" id="adjustProduct"></p><input type="hidden" name="productId"><div class="formgrid"><div class="field"><label>Date</label><input name="date" type="date"></div><div class="field"><label>Quantity change</label><input name="qty" type="number" step=".01" placeholder="Use - for reduction"></div><div class="field full"><label>Reason</label><input name="reason" placeholder="Count correction, damage, opening correction..." required></div></div><div class="footer"><button type="button" class="btn" id="adjustCancel">Cancel</button><button class="btn primary">Save Adjustment</button></div></form></dialog>
      </main>
    </div>
    <script type="module" src="../assets/js/bootstrap.js?entry=pages/inventory.js"></script>
  </body>
</html>
